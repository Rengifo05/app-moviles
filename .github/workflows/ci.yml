name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: App Flutter (formato, análisis, pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Caché de Flutter
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ runner.os }}-${{ hashFiles('tool/install_flutter.sh') }}

      - name: Caché de pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Instalar Flutter (versión fijada y verificada por SHA-256)
        run: |
          tool/install_flutter.sh "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Puertas de calidad
        run: tool/check.sh

  backend:
    name: Backend (tipos, reglas y funciones en el emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # El emulador de Firestore necesita Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Caché de los emuladores
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('functions/package-lock.json') }}

      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm run check:indexes
      - run: npm run build
      - name: Reglas y funciones contra el emulador (proyecto demo-, sin credenciales)
        run: npm test
      # Debilita cada condición de las reglas y exige que alguna prueba lo
      # detecte: garantiza que las pruebas fallan por el motivo correcto.
      - name: Pruebas de mutación de las reglas
        run: npm run test:mutations
