include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Las advertencias se tratan como errores para que CI no las deje pasar.
    missing_required_param: error
    missing_return: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - functions/**
    - "**/*.g.dart"
    - lib/l10n/gen/**

linter:
  rules:
    # Es una app, no un paquete publicado: documentar cada miembro público
    # añade ruido. Se documentan contratos y decisiones no evidentes.
    public_member_api_docs: false
